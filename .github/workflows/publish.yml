name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitLab npm registry
        run: |
          echo "//gitlab.com/api/v4/projects/87270453/packages/npm/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITLAB_NPM_TOKEN }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to GitLab Package Registry
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITLAB_NPM_TOKEN }}
